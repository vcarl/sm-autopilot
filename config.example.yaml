# Copied once into the runner's isolated Hermes home. Secrets stay in omlx settings.
model:
  default: mlx-community--Qwen3.6-35B-A3B-4bit
  provider: custom
  base_url: http://127.0.0.1:8000/v1
  context_length: 65536
tools:
  tool_search:
    enabled: "off"
compression:
  enabled: true
  abort_on_summary_failure: true
auxiliary:
  compression:
    provider: main
  title_generation:
    provider: main
memory:
  memory_enabled: false
  user_profile_enabled: false
