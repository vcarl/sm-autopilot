name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Weekly, against Hermes' default branch, so host drift shows up before a user hits it.
  schedule:
    - cron: "17 6 * * 1"
  workflow_call:

permissions:
  contents: read

jobs:
  typescript:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 24.15.0 is the engines floor: the first LTS whose node:sqlite loads without an ExperimentalWarning.
        node: ["24.15.0", "lts/*"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run lint
      - run: npm run gen:wire && git diff --exit-code -- src/wire.gen.ts src/wire-drift.gen.ts
      # status, not diff: a new play module is a new, untracked declaration file
      - run: npm run gen:play && test -z "$(git status --porcelain -- play.gen)"
      - run: node scripts/surface.ts --check
      # The patched tsc reports floatingEffect. A CI step, never `prepare`: that would also patch
      # the tsc a live profile's pilot gate runs.
      - run: npx effect-language-service patch && npm run typecheck

  python:
    runs-on: ubuntu-latest
    env:
      # Pushes and PRs test against a pinned Hermes release; the scheduled run tests main,
      # which supports only Python 3.14 while the release line wants >=3.11,<3.14.
      HERMES_REF: ${{ github.event_name == 'schedule' && 'main' || 'v2026.9.24' }}
      PYTHON: ${{ github.event_name == 'schedule' && '3.14' || '3.11' }}
      HERMES_AGENT_ROOT: ${{ github.workspace }}/hermes-agent
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON }}
      # Before Hermes is checked out beside it, so ruff sees only this repository.
      - run: pipx run ruff==0.16.9 check .
      - uses: actions/checkout@v7
        with:
          repository: NousResearch/hermes-agent
          ref: ${{ env.HERMES_REF }}
          path: hermes-agent
      # The plugin's Python shells out to the bridge's TypeScript (service.py's RENDER_COMMAND),
      # which imports its npm dependencies.
      - uses: actions/setup-node@v7
        with:
          node-version: "24.15.0"
          cache: npm
      - run: npm ci
      - run: pip install -e "$HERMES_AGENT_ROOT" pytest
      - run: python -m pytest
