name: spacemolt
version: 2026.10.4
description: "SpaceMolt pilot: play by editing pilot/index.ts; junctures and the observer window."
author: Carl Vitullo
kind: standalone
homepage: https://github.com/vcarl/sm-autopilot
requires_env:
  - SPACEMOLT_CREDENTIALS_FILE
provides_tools:
  - spacemolt_run
  - spacemolt_query
  - spacemolt_answer
  - spacemolt_reflect
  - spacemolt_look
  - spacemolt_stop
  - spacemolt_direct
# Nothing beyond the standard library: the game client is Node, reached through the bridge.
python_dependencies: []
# Declared so the two settings a working install needs are read from the manifest rather than
# learned from a failure. Hermes surfaces and validates these; it does not apply them — the
# timeout is a profile setting, because it bounds every tool the profile runs (see README.md).
config_schema:
  credentials_file:
    type: string
    description: >-
      Path to the SpaceMolt game credentials file. Set as the profile secret
      SPACEMOLT_CREDENTIALS_FILE; the bridge refuses to start without it.
  journal_webhook:
    type: string
    description: >-
      Optional Discord webhook the rendered journal is posted to, as the profile secret
      SPACEMOLT_JOURNAL_WEBHOOK. Absent, the bridge posts nothing.
  imager_url:
    type: string
    description: >-
      Optional image server (mlx-serve's /v1/images/generations) that draws a picture at the end of
      every flight, as the profile secret SPACEMOLT_IMAGER_URL. Pictures go to
      spacemolt/runtime/images/ and, with a journal webhook, to Discord. Absent, no pictures.
  imager_key:
    type: string
    description: Optional bearer token for the image server, as the profile secret SPACEMOLT_IMAGER_KEY.
  image_model:
    type: string
    description: >-
      Optional model name the image server is asked for, as the profile secret
      SPACEMOLT_IMAGE_MODEL. Default ddalcu/Qwen-Image-2.1-Turbo-MLX-Serve-8bit.
  image_style:
    type: string
    description: Optional style line every picture prompt leads with, as the profile secret SPACEMOLT_IMAGE_STYLE.
  sequential_call_timeout:
    type: integer
    default: 0
    description: >-
      REQUIRED as profile config timeouts.tools.sequential_call. One spacemolt_run blocks until
      the flight ends, and a flight has no time limit; the core default of 420s kills it first
      and the report is lost. Set it to 0, which disables the bound (cron's inactivity watchdog
      is still touched every 30s while a tool runs).
